<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Shooter · Descargar</title>
<style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.c{max-width:420px;padding:24px;text-align:center}h1{color:#f5c542;margin:0 0 6px}p{color:#aab}
button,a.b{display:block;width:100%;padding:16px;margin-top:18px;font-size:20px;font-weight:700;border:0;border-radius:10px;background:#f5c542;color:#111;text-decoration:none}
.bar{height:14px;background:#223;border-radius:7px;margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4ade80}</style></head>
<body><div class="c"><h1>GHOST SHOOTER</h1><p>Versión 11.73 HD · 1117 MB</p>
<button id="go">DESCARGAR APK</button><div class="bar"><i id="bar"></i></div><p id="st"></p></div>
<script>
const N=13, SIZE=1170859239;
document.getElementById('go').onclick=async()=>{
  const go=document.getElementById('go'),st=document.getElementById('st'),bar=document.getElementById('bar');
  go.disabled=true;const parts=[];let got=0;
  try{
    for(let i=0;i<N;i++){
      st.textContent='Descargando parte '+(i+1)+' de '+N+'…';
      const r=await fetch('apk/hd.part'+String(i).padStart(2,'0')+'?v='+SIZE,{cache:'no-store'});
      if(!r.ok)throw new Error('parte '+(i+1)+': '+r.status);
      const b=await r.blob();parts.push(b);got+=b.size;bar.style.width=(100*got/SIZE)+'%';
    }
    const apk=new Blob(parts,{type:'application/vnd.android.package-archive'});
    const a=document.createElement('a');a.href=URL.createObjectURL(apk);a.download='GhostShooter-11.73-HD.apk';
    a.className='b';a.textContent='GUARDAR / INSTALAR APK';document.querySelector('.c').appendChild(a);a.click();
    st.textContent='Listo. Si no se guardó solo, toca el botón verde.';
  }catch(e){st.textContent='Error: '+e.message+' — vuelve a intentar.';go.disabled=false;}
};
</script></body></html>
